[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utas-research-degree-assistant"
version = "0.1.0"
description = "Unofficial student-built UTAS research-degree discovery prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.7,<3",
    "PyMuPDF>=1.24,<2",
    "rank-bm25>=0.2.2,<0.3",
    "sentence-transformers>=3,<6",
    "numpy>=1.26,<3",
    "rdflib>=7,<8",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
browser = ["playwright>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
